[package]
name = "rayclip"
version = "0.1.35"
description = "Clipboard History - recriacao do Raycast Clipboard"
edition = "2021"
rust-version = "1.77"

[lib]
name = "rayclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# SQLCipher compilado do fonte com libtomcrypt (sem OpenSSL/Perl no build).
cc = "1"
sqlcipher-src = "=420.0.0"

[dependencies]
tauri = { version = "2", features = [ "image-png", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "gif", "jpeg", "webp"] }
clipboard-win = "5"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
base64 = "0.22"
sha2 = "0.10"
[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_System_WinRT",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_Com",
]

[dependencies.windows-sys]
version = "0.60"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security_Cryptography",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
